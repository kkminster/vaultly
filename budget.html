<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2327092554390919"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget Planner & Expense Tracker - Vaultly</title>

<meta name="description" content="Plan your monthly budget, track expenses, and improve your spending habits with Vaultly.">
  <link rel="stylesheet" href="style.css">
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <h1>Vaultly</h1>
        <p class="tagline">Budget & Expenses</p>
      </div>
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="savings.html">Savings</a>
      <a href="budget.html">Budget</a>
      <a href="calculators.html">Calculators</a>
      <a href="calculator-guides.html">Guides</a>
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page-container">
    <section class="card">
      <h2>Monthly Budget Planner</h2>

      <div class="form-grid">
        <input type="number" id="monthlyIncome" placeholder="Monthly income (£)">
        <input type="number" id="budgetNeeds" placeholder="Needs budget (£)">
        <input type="number" id="budgetWants" placeholder="Wants budget (£)">
        <input type="number" id="budgetSavings" placeholder="Savings budget (£)">
      </div>

      <button onclick="saveBudget()">Save Budget</button>
      <div id="budgetResult" class="result-box"></div>
    </section>

    <section class="card">
      <h2>Add Expense</h2>

      <div class="form-grid">
        <input type="text" id="expenseName" placeholder="Expense name">
        <input type="number" id="expenseAmount" placeholder="Amount (£)">
        <input type="date" id="expenseDate">
        <select id="expenseCategory">
          <option value="Needs">Needs</option>
          <option value="Wants">Wants</option>
          <option value="Savings">Savings</option>
          <option value="Bills">Bills</option>
          <option value="Transport">Transport</option>
          <option value="Food">Food</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button onclick="addExpense()">Add Expense</button>
    </section>

    <section class="card">
      <h2>Expenses Chart</h2>
      <div class="chart-wrap">
        <canvas id="budgetPieChart"></canvas>
      </div>
    </section>

    <section class="card">
      <div class="section-row">
        <h2>Expenses</h2>
        <button class="secondary-btn" onclick="clearExpenses()">Clear Expenses</button>
      </div>

      <div id="expensesList"></div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    let budgetPieChart = null;

    function getStoredExpenses() {
      try {
        return JSON.parse(localStorage.getItem("vaultlyExpenses")) || [];
      } catch {
        return [];
      }
    }

    function drawBudgetChart() {
      const canvas = document.getElementById("budgetPieChart");
      if (!canvas || typeof Chart === "undefined") return;

      const expenses = getStoredExpenses();
      const totals = {};

      expenses.forEach(expense => {
        const category = expense.category || "Other";
        totals[category] = (totals[category] || 0) + Number(expense.amount || 0);
      });

      const labels = Object.keys(totals);
      const values = Object.values(totals);

      if (budgetPieChart) {
        budgetPieChart.destroy();
        budgetPieChart = null;
      }

      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (labels.length === 0) return;

      budgetPieChart = new Chart(ctx, {
        type: "pie",
        data: {
          labels: labels,
          datasets: [{
            data: values
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false
        }
      });
    }

    const oldAddExpense = window.addExpense;
    if (typeof oldAddExpense === "function") {
      window.addExpense = function () {
        oldAddExpense();
        drawBudgetChart();
      };
    }

    const oldClearExpenses = window.clearExpenses;
    if (typeof oldClearExpenses === "function") {
      window.clearExpenses = function () {
        oldClearExpenses();
        drawBudgetChart();
      };
    }

    const oldRenderExpenses = window.renderExpenses;
    if (typeof oldRenderExpenses === "function") {
      window.renderExpenses = function () {
        oldRenderExpenses();
        drawBudgetChart();
      };
    }

    document.addEventListener("DOMContentLoaded", function () {
      drawBudgetChart();
    });
  </script>
</body>
</html>

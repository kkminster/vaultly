<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2327092554390919"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Finance Calculators - Vaultly</title>

<meta name="description" content="Use free UK finance calculators including mortgage, salary tax, debt payoff, loan repayment, and savings interest tools.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <h1>Vaultly</h1>
        <p class="tagline">Finance Calculators</p>
      </div>
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="savings.html">Savings</a>
      <a href="budget.html">Budget</a>
      <a href="calculators.html">Calculators</a>
      <a href="calculator-guides.html">Guides</a>
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="page-container">
    <section class="card">
      <h2>UK Salary After Tax Calculator</h2>
      <div class="form-grid">
        <input type="number" id="salaryInput" placeholder="Annual salary (£)">
      </div>
      <button onclick="calculateSalaryTax()">Calculate Salary</button>
      <div id="salaryResult" class="result-box"></div>
    </section>

    <section class="card">
      <h2>UK Loan Calculator</h2>
      <div class="form-grid">
        <input type="number" id="loanAmount" placeholder="Loan amount (£)">
        <input type="number" id="interestRate" placeholder="Interest rate (%)" step="0.1">
        <input type="number" id="loanYears" placeholder="Loan term (years)">
      </div>
      <button onclick="calculateLoan()">Calculate Loan</button>
      <div id="loanResult" class="result-box"></div>
      <div id="loanTable" class="result-box"></div>
    </section>

    <section class="card">
      <h2>Mortgage Calculator</h2>
      <div class="form-grid">
        <input type="number" id="mortgageAmount" placeholder="Property price (£)">
        <input type="number" id="mortgageRate" placeholder="Interest rate (%)" step="0.1">
        <input type="number" id="mortgageYears" placeholder="Mortgage term (years)">
        <input type="number" id="depositAmount" placeholder="Deposit (£)">
      </div>
      <button onclick="calculateMortgage()">Calculate Mortgage</button>
      <div id="mortgageResult" class="result-box"></div>
    </section>

    <section class="card">
      <h2>Emergency Fund Calculator</h2>
      <div class="form-grid">
        <input type="number" id="emergencyMonthly" placeholder="Monthly essential costs (£)">
        <input type="number" id="emergencyMonths" placeholder="Months to cover">
      </div>
      <button onclick="calculateEmergencyFund()">Calculate Fund</button>
      <div id="emergencyResult" class="result-box"></div>
    </section>

    <section class="card">
      <h2>Inflation Calculator</h2>
      <div class="form-grid">
        <input type="number" id="inflationAmount" placeholder="Amount today (£)">
        <input type="number" id="inflationRate" placeholder="Inflation rate (%)" step="0.1">
        <input type="number" id="inflationYears" placeholder="Years">
      </div>
      <button onclick="calculateInflation()">Calculate Inflation</button>
      <div id="inflationResult" class="result-box"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
